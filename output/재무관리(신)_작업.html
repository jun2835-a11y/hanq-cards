<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재무관리(신) 작업 — hanQ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F0;--surface:#FFFFFF;--border:#E2DED7;--ink:#1A1814;--ink2:#5C5851;
  --muted:#9A958F;--accent:#C8380A;--green:#2E7D32;--yellow:#F9A825;
}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:13px;min-height:100vh;display:flex;flex-direction:column}

/* ── 탭바 ── */
.tab-bar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 24px;position:sticky;top:0;z-index:100}
.tab-btn{padding:14px 18px;font-size:12px;font-weight:500;letter-spacing:.03em;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab-badge{display:inline-block;background:var(--accent);color:white;font-size:9px;font-weight:700;padding:1px 5px;margin-left:5px;vertical-align:middle}

/* ── 진행률 헤더 ── */
.progress-bar-wrap{background:var(--ink);padding:10px 24px;display:flex;align-items:center;gap:16px}
.progress-label{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.04em;white-space:nowrap}
.progress-track{flex:1;height:4px;background:rgba(255,255,255,.12)}
.progress-fill{height:100%;background:var(--accent);transition:width .4s ease}
.progress-stats{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap}
.progress-stats b{color:white;font-weight:700}

/* ── 패널 ── */
.panel{display:none;padding:28px 24px;flex:1}
.panel.active{display:block}

/* ── 업로드 탭 ── */
.upload-zone{border:2px dashed var(--border);background:var(--surface);padding:48px 32px;text-align:center;cursor:pointer;transition:all .2s;max-width:600px;margin:0 auto}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:#FFF8F6}
.upload-icon{margin-bottom:20px;line-height:0}
.file-anim-svg{display:block;margin:0 auto}
.file-curl{animation:pageCurl 2.6s ease-in-out infinite}
@keyframes pageCurl{
  0%,18%,78%,100%{transform:translate(0,0)}
  44%,62%        {transform:translate(5px,-5px)}
}
.upload-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px}
.upload-sub{font-size:12px;color:var(--muted);line-height:1.7}
.upload-btn{display:inline-block;margin-top:20px;background:var(--ink);color:white;font-size:11px;font-weight:700;letter-spacing:.06em;padding:9px 20px;cursor:pointer;text-transform:uppercase}
input[type=file]{display:none}

.file-list{max-width:600px;margin:20px auto 0}
.file-item{background:var(--surface);border:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:6px}
.file-bank{font-size:10px;font-weight:700;letter-spacing:.08em;color:white;padding:2px 7px;background:var(--ink)}
.file-bank.kb{background:#0050A0}
.file-bank.nh{background:#006236}
.file-bank.gj{background:#0067B1}
.file-bank.sh{background:#0046AF}
.file-bank.unknown{background:var(--muted)}
.file-name{flex:1;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-rows{font-size:11px;color:var(--muted)}
.file-remove{cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:2px}
.file-remove:hover{color:var(--accent)}

.parse-btn{display:block;max-width:600px;margin:16px auto 0;background:var(--accent);color:white;font-size:12px;font-weight:700;letter-spacing:.06em;padding:12px;text-align:center;cursor:pointer;border:none;font-family:inherit;text-transform:uppercase;width:100%}
.parse-btn:disabled{opacity:.4;cursor:not-allowed}

.parse-result{max-width:600px;margin:16px auto 0;background:var(--surface);border:1px solid var(--border);padding:16px 20px;font-size:12px;line-height:1.8;color:var(--ink2)}
.parse-result b{color:var(--ink);font-weight:700}

/* ── 태깅 탭 ── */
.tag-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search-box{border:1px solid var(--border);background:var(--surface);padding:7px 12px;font-size:12px;font-family:inherit;color:var(--ink);width:220px;outline:none}
.search-box:focus{border-color:var(--ink)}
.filter-btn{padding:6px 12px;font-size:11px;font-weight:500;letter-spacing:.04em;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink2);font-family:inherit;transition:all .15s}
.filter-btn:hover{border-color:var(--ink);color:var(--ink)}
.filter-btn.active{background:var(--ink);color:white;border-color:var(--ink)}
.tag-count{font-size:11px;color:var(--muted);margin-left:auto}

.merchant-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border)}
.merchant-table th{background:var(--ink);color:rgba(255,255,255,.7);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;text-align:left;white-space:nowrap}
.merchant-table td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12px}
.merchant-table tr:last-child td{border-bottom:none}
.merchant-table tr.untagged td{background:#FFFBF0}
.merchant-table tr:hover td{background:#F2F0EB}
.merchant-table tr.untagged:hover td{background:#FFF5DC}
.merchant-table thead th{position:sticky;top:0;z-index:1}
.vs-scroll-wrap{height:calc(100vh - 340px);min-height:300px;overflow-y:auto}
.vs-spacer td{padding:0!important;border:none!important;background:transparent!important}

.td-merchant{font-weight:500;color:var(--ink);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-merchant .staff-name{color:#1A56B0;font-weight:700}
.td-count{color:var(--muted);text-align:right;white-space:nowrap}
.td-amount{text-align:right;font-weight:500;white-space:nowrap}
.td-sample{color:var(--muted);font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cat-select,.biz-select{border:1px solid var(--border);background:var(--bg);padding:5px 8px;font-size:11px;font-family:inherit;color:var(--ink);cursor:pointer;outline:none;max-width:130px}
.cat-select:focus,.biz-select:focus{border-color:var(--ink)}
.cat-select.tagged{background:#EFF6EE;border-color:#A5D6A7;color:var(--green)}
.cat-select.untagged{background:#FFF8E1;border-color:#FFE082;color:#7B6200}

.tag-status{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;flex-shrink:0}
.tag-status.done{background:#4CAF50}
.tag-status.pending{background:#FFC107}

/* ── 집계 탭 ── */
.agg-controls{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.agg-select{border:1px solid var(--border);background:var(--surface);padding:7px 12px;font-size:12px;font-family:inherit;color:var(--ink);outline:none;cursor:pointer}
.export-btn{margin-left:auto;background:var(--ink);color:white;font-size:11px;font-weight:700;letter-spacing:.05em;padding:8px 16px;cursor:pointer;border:none;font-family:inherit}
.agg-mode-btns{display:flex;border:1px solid var(--border);overflow:hidden;flex-shrink:0}
.agg-mode-btn{padding:7px 16px;font-size:12px;font-weight:700;background:var(--surface);color:var(--muted);border:none;cursor:pointer;font-family:inherit;letter-spacing:.04em}
.agg-mode-btn.active{background:var(--ink);color:#fff}

.agg-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);font-size:12px}
.agg-table th{background:#2A2622;color:rgba(255,255,255,.7);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:9px 12px;text-align:right;white-space:nowrap}
.agg-table th:first-child{text-align:left}
.agg-table td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:right;color:var(--ink2);white-space:nowrap}
.agg-table td:first-child{text-align:left;font-weight:500;color:var(--ink)}
.agg-table tr.total td{font-weight:700;color:var(--ink);background:#F2F0EB;border-top:2px solid var(--border)}
.agg-table tr.year-sep td{background:#2A2622;color:rgba(255,255,255,.8);font-size:11px;font-weight:700;letter-spacing:.12em;padding:7px 12px;border-bottom:none}
.agg-table tr.year-sub td{font-weight:700;color:var(--ink);background:#EDE9E3;border-top:2px solid #BBAFA0;border-bottom:2px solid #BBAFA0}
.agg-table tr:last-child td{border-bottom:none}
.agg-table .zero{color:var(--muted)}

.no-data{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}

.cat-filter-sel{border:1px solid var(--border);background:var(--surface);padding:6px 10px;font-size:11px;font-family:inherit;color:var(--ink);cursor:pointer;outline:none;max-width:140px}
.cat-filter-sel:focus{border-color:var(--ink)}

/* 저장 상태 */
.save-indicator{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;letter-spacing:.03em;margin-left:auto;padding:0 12px;color:var(--muted);transition:color .3s;align-self:center}
.save-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;display:block;transition:background .3s}
.save-indicator.saved{color:#2E7D32}
.save-indicator.saving{color:#E65100}
.save-indicator.saving .save-dot{animation:siDotPulse 1.1s ease-in-out infinite}
.save-indicator.error{color:#C62828}
.save-indicator.nosb{color:#C62828}
@keyframes siDotPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(2.2);opacity:.15}
}
/* 프로젝트 셀렉트 */
.proj-select{border:1px solid var(--border);background:var(--bg);padding:5px 8px;font-size:11px;font-family:inherit;color:var(--ink);cursor:pointer;outline:none;max-width:140px}
.proj-select:focus{border-color:var(--ink)}

/* ── 로딩 인디케이터 ── */
#ld-bar{position:fixed;top:0;left:0;width:100%;height:3px;z-index:9999;overflow:hidden;pointer-events:none;display:none}
#ld-bar.active{display:block}
#ld-bar-inner{position:absolute;top:0;left:-50%;width:45%;height:100%;background:var(--accent)}
#ld-bar.active #ld-bar-inner{animation:ldSlide 1.05s cubic-bezier(.4,0,.6,1) infinite}
@keyframes ldSlide{0%{left:-45%}100%{left:105%}}
#ld-toast{position:fixed;bottom:56px;right:20px;z-index:9998;background:var(--ink);color:white;padding:9px 15px;font-size:11px;letter-spacing:.04em;display:flex;align-items:center;gap:9px;box-shadow:0 3px 14px rgba(0,0,0,.2);pointer-events:none;opacity:0;transition:opacity .18s,transform .18s;transform:translateY(6px)}
#ld-toast.show{opacity:1;transform:translateY(0)}
#ld-spin{width:11px;height:11px;border:1.5px solid rgba(255,255,255,.2);border-top-color:white;border-radius:50%;animation:ldSpin .65s linear infinite;flex-shrink:0}
@keyframes ldSpin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="ld-bar"><div id="ld-bar-inner"></div></div>
<div id="ld-toast"><div id="ld-spin"></div><span id="ld-msg">처리 중...</span></div>

<div class="progress-bar-wrap" id="progressWrap" style="display:none">
  <span class="progress-label">태깅 진행률</span>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <span class="progress-stats"><b id="progressDone">0</b> / <b id="progressTotal">0</b> 거래내용 · <span id="progressPct">0%</span></span>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('upload')">CSV 업로드</button>
  <button class="tab-btn" id="tabTag" onclick="switchTab('tag')">태깅 작업 <span class="tab-badge" id="pendingBadge" style="display:none">0</span></button>
  <button class="tab-btn" id="tabAgg" onclick="switchTab('agg')">집계</button>
  <div class="save-indicator" id="saveInd"><span class="save-dot"></span><span id="saveText">대기 중</span></div>
</div>

<!-- ── 탭 1: 업로드 ── -->
<div class="panel active" id="panelUpload">
  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">
      <svg class="file-anim-svg" viewBox="-8 -8 64 76" width="60" height="72" fill="none" xmlns="http://www.w3.org/2000/svg" overflow="visible">
        <!-- 문서 본체 (우상단 모서리 컷) -->
        <path d="M4 4 L30 4 L44 20 L44 56 L4 56 Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round" opacity=".7"/>
        <!-- 접힌 선 (정적) -->
        <path d="M30 4 L30 20 L44 20" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round" opacity=".4"/>
        <!-- 모서리 플랩 (애니메이션) -->
        <path class="file-curl" d="M30 4 L44 4 L44 20 Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
        <!-- 내용 줄 -->
        <line x1="12" y1="30" x2="36" y2="30" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" opacity=".2"/>
        <line x1="12" y1="38" x2="36" y2="38" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" opacity=".2"/>
        <line x1="12" y1="46" x2="26" y2="46" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" opacity=".2"/>
      </svg>
    </div>
    <div class="upload-title">CSV 파일을 드래그하거나 클릭해서 업로드</div>
    <div class="upload-sub">KB · 농협 · 광주 · 신한 지원<br>CSV · Excel(.xlsx/.xls) · 여러 파일 동시 선택 · 은행 자동 감지</div>
    <div class="upload-btn">파일 선택</div>
  </div>
  <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" multiple>

  <div class="file-list" id="fileList"></div>
  <button class="parse-btn" id="parseBtn" disabled onclick="parseAll()">파싱 시작</button>
  <div class="parse-result" id="parseResult" style="display:none"></div>
</div>

<!-- ── 탭 2: 태깅 ── -->
<div class="panel" id="panelTag">
  <div class="tag-toolbar">
    <input class="search-box" id="tagSearch" placeholder="거래내용 검색..." oninput="renderMerchants()">
    <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">전체</button>
    <button class="filter-btn" id="filterPending" onclick="setFilter('pending')">미분류만</button>
    <button class="filter-btn" id="filterDone" onclick="setFilter('done')">완료만</button>
    <select class="cat-filter-sel" id="filterCat" onchange="renderMerchants()">
      <option value="">카테고리 전체</option>
    </select>
    <button class="filter-btn" onclick="resetTags()" style="color:var(--accent);border-color:rgba(200,56,10,.4)">태그 초기화</button>
    <span class="tag-count" id="tagCount"></span>
  </div>
  <div id="merchantTableWrap">
    <div class="no-data">CSV를 먼저 업로드하고 파싱해주세요</div>
  </div>
</div>

<!-- ── 탭 3: 집계 ── -->
<div class="panel" id="panelAgg">
  <div class="agg-controls">
    <div class="agg-mode-btns">
      <button class="agg-mode-btn active" id="aggModeOut" onclick="switchAggMode('out')">출금</button>
      <button class="agg-mode-btn" id="aggModeIn" onclick="switchAggMode('in')">입금</button>
    </div>
    <select class="agg-select" id="aggYear" onchange="renderAgg()"><option value="">연도 선택</option></select>
    <select class="agg-select" id="aggBiz" onchange="renderAgg()">
      <option value="">전체 사업자</option>
      <option>한솔</option><option>수복지</option><option>한큐</option><option>교육원</option><option>미배분</option>
    </select>
    <span id="aggCatWrap"><select class="agg-select" id="aggCat" onchange="renderAgg()">
      <option value="">전체 카테고리</option>
    </select></span>
    <select class="agg-select" id="aggView" onchange="renderAgg()">
      <option value="month">월별</option>
      <option value="cat" id="aggViewCatOpt">카테고리별</option>
    </select>
    <button class="export-btn" onclick="exportCSV()">CSV 내보내기</button>
  </div>
  <div id="aggTableWrap"><div class="no-data">태깅 완료 후 집계를 확인하세요</div></div>
</div>

<script>
// ── 상수 ──────────────────────────────────────────────
const CATS = ['인건비','4대보험','3.3소득세','식비/경비','임대료','제세공과금','통신비',
  '마케팅/광고비','특허','변호사비','인증비','IT인프라비','사무용품/사무집기','복리후생비','차량유지비','지급수수료','금융비용(이자)','일괄송금(사유확인불가)','기타'];

// 카테고리 드롭다운 초기화 (태깅 필터 + 집계 필터)
(function(){
  ['filterCat', 'aggCat'].forEach(function(id){
    var sel = document.getElementById(id);
    CATS.forEach(function(c){
      var opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
    if (id === 'aggCat') {
      var opt = document.createElement('option');
      opt.value = '미분류'; opt.textContent = '미분류';
      sel.appendChild(opt);
    }
  });
})();

const BIZS = ['한솔','수복지','한큐','교육원','미배분'];

// 사업자별 프로젝트 선택지
const PROJ_BY_BIZ = {
  '한솔': ['아고라 개발','아고라 디자인','아고라 영업'],
  '한큐': ['한큐 개발','한큐 영업','한큐재무 개발','한큐재무','한큐의료기'],
};

// 키워드 자동 태깅 룰 (거래처명에서 매칭)
// 직원 이름 목록 (인건비 자동 태깅)
const STAFF_NAMES = [
  '정재승','정종각',
  '곽은진','국희현','김가람','김광수','김도연','김선후','김정애',
  '노신애','반유환','박연식','박신주','박종환','박태성','박태욱',
  '손용진','오승빈','윤설하','윤여륜','이경근','이세은','이승미','이승학','이지성',
  '임준호','장예진','전인서','조승현','조용원','조유진',
  '최동훈','최지원','최충호','허정영','황지애'
];

const AUTO_RULES = [
  { cat:'기타',                biz:'', kw:['급여'] },
  { cat:'일괄송금(사유확인불가)', biz:'', kw:['일괄'] },
  { cat:'4대보험',    biz:'',     kw:['건강보험','국민연금','고용보험','산재보험','4대보험','건강공단','연금공단','근로복지','국민건강보험','건강보험료'] },

function saveState() {
  setSaveStatus('saving');
  clearTimeout(_saveTimer);

}

function doSave(attempt) {
  // tagged: 태그된 거래처 전체 데이터 / allMeta: 모든 거래처 [키,건수,출금합,입금합,날짜]
  var tagged = {};
  var allMeta = [];
  Object.keys(_merchants).forEach(function(k) {
    var m = _merchants[k];
    allMeta.push([k, m.count || 0, m.totalOut || 0, m.totalIn || 0, m.sampleDate || '']);
    if (m.cat || m.biz) tagged[k] = m;
  });
  if (attempt === 0) showLoad('저장 중...');
  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ merchants: tagged, allMeta: allMeta })
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(res) {
    hideLoad();
    setSaveStatus(res && res.supabase === false ? 'nosb' : 'saved');
  }).catch(function(e) {
    console.error('[saveState error] attempt=' + attempt, e.message);
    if (attempt < 2) {
      setTimeout(function() { doSave(attempt + 1); }, 5000);
    } else {
      hideLoad();
      setSaveStatus('error');
    }
  });
}

}

function loadStateOnInit() {
  showLoad('데이터 불러오는 중...');
  fetch(API).then(function(r){ return r.json(); }).then(function(saved){
    hideLoad();
    if (!saved) return;
    var taggedData = saved.merchants || {};
    var allMeta   = saved.allMeta  || [];   // 신규: [[key, count, totalOut, totalIn, sampleDate], ...]
    var allKeys   = saved.allKeys  || [];   // 구버전 호환

    var hasData = allMeta.length > 0 || allKeys.length > 0 || Object.keys(taggedData).length > 0;
    if (!hasData) return;

    _merchants = {};
    if (allMeta.length > 0) {
      // 신규 포맷: allMeta에 건수·금액 포함
      allMeta.forEach(function(meta) {
        var k = meta[0];

          _merchants[k] = taggedData[k];

          _merchants[k] = {

            totalIn: meta[3] || 0, sampleDate: meta[4] || '',
            cat: '', biz: '', autoTagged: false
          };
        }
      });
    } else {
      // 구버전 호환: allKeys는 키 이름만 있음
      var keys = allKeys.length > 0 ? allKeys : Object.keys(taggedData);
      keys.forEach(function(k) {

function detectBank(headers) {
  // 공백 제거 후 비교 (SheetJS가 셀 내용에 공백 포함할 수 있음)
  var h = headers.map(function(x){ return x.replace(/\s+/g,''); }).join(',');
  if (h.includes('보낸분') || h.includes('받는분')) return 'KB';
  if (h.includes('거래기록사항') || h.includes('기록사항') || h.includes('출금금액') ||
      (h.includes('출금액') && h.includes('입금액'))) return '농협';
  if (h.includes('출금(원)') || h.includes('입금(원)')) return '신한';
  if (h.includes('입/출금') || h.includes('통장잔액') || h.includes('적요')) return '광주';
  return '?';
}

// 파일명에서 은행 추정 (detectBank 실패 시 보조)
function bankFromFilename(filename) {
  var fn = filename || '';
  if (fn.includes('농협') || fn.includes('NH_') || fn.includes('_NH')) return '농협';
  if (/^KB/.test(fn) || fn.includes('국민') || fn.includes('_KB')) return 'KB';
  if (fn.includes('신한') || fn.includes('SH_')) return '신한';
  if (fn.includes('광주') || fn.includes('GJ_')) return '광주';
  return '?';
}

// 헤더 문자열 정규화: 공백 제거 + 전각슬래시→반각
function normH(h) { return h.replace(/\s/g,'').replace(/[／＼]/g,'/'); }

// 은행별 거래내용 컬럼 인덱스 반환
// KB→보낸분/받는분, 농협→거래기록사항/적요/거래내용, 신한→내용, 광주→적요
function findMerchantCol(headers, bank) {
  var BANK_EXACT = {
    'KB':   ['보낸분/받는분'],
    '농협': ['거래기록사항', '기록사항', '거래내용', '적요', '내용'],
    '신한': ['내용'],
    '광주': ['적요'],
  };
  var BANK_CONTAINS = {
    'KB':   ['보낸분','받는분'],
    '농협': ['거래기록사항', '기록사항', '거래내용', '적요', '내용'],
    '신한': ['내용'],
    '광주': ['적요'],
  };
  var exactList    = BANK_EXACT[bank]    || ['보낸분/받는분','거래기록사항','기록사항','적요','내용'];
  var containsList = BANK_CONTAINS[bank] || ['보낸분','받는분','거래기록사항','기록사항','적요','내용'];

  // 1단계: 정규화 후 정확 일치
  for (var ci = 0; ci < exactList.length; ci++) {
    for (var hi = 0; hi < headers.length; hi++) {
      if (normH(headers[hi]) === exactList[ci]) return hi;
    }
  }
  // 2단계: 포함 여부 (정규화 후)
  for (var ci2 = 0; ci2 < containsList.length; ci2++) {
    for (var hi2 = 0; hi2 < headers.length; hi2++) {
      if (normH(headers[hi2]).includes(containsList[ci2])) return hi2;
    }
  }
  console.warn('[findMerchantCol] 컬럼 미발견 bank='+bank+' headers='+headers.join('|'));
  return -1;
}

function bankClass(bank) {
  return {KB:'kb','농협':'nh','광주':'gj','신한':'sh'}[bank] || 'unknown';
}

// ── CSV 파싱 ──────────────────────────────────────────
function parseCSVText(text, bank) {
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
  var result = [];

  // 헤더 행 찾기 (날짜 키워드로)
  var headerIdx = -1;
  for (var i = 0; i < Math.min(lines.length, 30); i++) {
    var lower = lines[i].toLowerCase();
    if (lower.includes('거래일') || lower.includes('날짜')) { headerIdx = i; break; }
  }
  if (headerIdx < 0) return result;

  var headers = splitCSVLine(lines[headerIdx]);

  // 컬럼 인덱스
  var iDate = -1, iMerchant = -1, iOut = -1, iIn = -1;
  iMerchant = findMerchantCol(headers.map(function(h){ return h.trim(); }), bank);
  headers.forEach(function(h, i) {
    var t = h.trim();
    if (iDate < 0 && (t.includes('거래일') || t === '날짜' || t === '일시')) iDate = i;
    if (iOut < 0 && (t === '출금액' || t === '출금금액' || t === '출금' || t === '출금(원)')) iOut = i;
    if (iIn < 0 && (t === '입금액' || t === '입금금액' || t === '입금' || t === '입금(원)')) iIn = i;
  });

  for (var j = headerIdx + 1; j < lines.length; j++) {
    var cols = splitCSVLine(lines[j]);
    if (cols.length < 3) continue;
    var dateRaw = iDate >= 0 ? cols[iDate] : '';
    var merchant = iMerchant >= 0 ? cols[iMerchant] : '';
    var outRaw = iOut >= 0 ? cols[iOut] : '';
    var inRaw = iIn >= 0 ? cols[iIn] : '';

    merchant = merchant.trim().replace(/"/g, '');
    if (!merchant || merchant === '-') continue;

    var out = parseAmount(outRaw);
    var inn = parseAmount(inRaw);
    var date = normalizeDate(dateRaw);

    if (!date) continue;

    result.push({ date: date, merchant: merchant, out: out, in: inn, bank: bank });
  }
  return result;
}

function splitCSVLine(line) {
  var result = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += c;
  }
  result.push(cur);
  return result;
}

function parseAmount(s) {
  if (!s) return 0;
  var n = parseInt(s.replace(/[^0-9]/g, ''), 10);
  return isNaN(n) ? 0 : n;
}

function normalizeDate(s) {
  s = String(s).trim().replace(/"/g, '');
  // "2024. 1.15" 형태: 구분자 주변 공백 제거
  s = s.replace(/\s*([-\/\.])\s*(?=\d)/g, '$1').replace(/(?<=\d)\s*([-\/\.])\s*/g, '$1');
  // YYYY-MM-DD or YYYY/MM/DD or YYYY.MM.DD (구분자 혼합도 허용)
  var m = s.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
  if (m) return m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]);
  // YYYYMMDD (8자리 연속 숫자)
  m = s.match(/^(\d{4})(\d{2})(\d{2})(?!\d)/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  // YYYY년 M월 D일 (한국어 날짜)
  m = s.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})/);
  if (m) return m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]);
  // M/D/YYYY (SheetJS raw:false 출력 포맷)
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3] + '-' + pad2(+m[1]) + '-' + pad2(+m[2]);
  // Excel serial number (raw:true 시)
  var n = parseFloat(s);
  if (!isNaN(n) && n > 40000 && n < 60000) {
    var d = new Date(Math.round((n - 25569) * 86400000));
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth()+1) + '-' + pad2(d.getUTCDate());
  }
  return '';
}

  '강좌','강의','강남','강북','강원','조회','조정','조건','조세',
  // 국·한
  '국내','국외','국제','국민','국가','한국','한솔','한큐','한전','한화',
  // 서·신·현
  '서울','서비','서비스','신한','신용','신규','현금','현대',
  // 마·연·오·주·임·장·원·손
  '마트','연금','연말','연체','오픈','오일','주식','주소','주차','주유',
  '임대','임시','임금','임차','장기','장비','장터','원금','원천','손해',

  '공과','충전','인증','인터','수수','공사','공단','보험',
];

// 은행 이체 접두/접미어 (이름 추출 시 제거 대상)
var TRANSFER_AFFIXES = ['자동이체','타행이체','당행이체','계좌이체','인터넷이체','실시간이체','전자이체','이체','입금','출금','님','귀중','앞'];

function isPersonName(s) {
  return s.length >= 2 && s.length <= 3 && KR_SURNAMES.includes(s[0]) && NAME_EXCL.indexOf(s) === -1;
}

function looksLikePersonName(merchantName) {
  var tokens = merchantName.split(/[^가-힣]+/);
  for (var i = 0; i < tokens.length; i++) {
    var t = tokens[i];
    if (!t) continue;

    // 1단계: 토큰 자체가 이름인지
    if (isPersonName(t)) return true;

    // 2단계: "홍길동이체" — 이체 접미어/접두어 제거 후 이름 확인
    for (var j = 0; j < TRANSFER_AFFIXES.length; j++) {
      var aff = TRANSFER_AFFIXES[j];
      if (t.length > aff.length) {
        if (t.slice(-aff.length) === aff && isPersonName(t.slice(0, t.length - aff.length))) return true;
        if (t.slice(0, aff.length) === aff && isPersonName(t.slice(aff.length))) return true;
      }
    }

    // 3단계: "농협오픈윤여륜" — 긴 토큰 끝부분이 이름인 경우 (은행·서비스명+이름 패턴)
    if (t.length >= 4) {
      if (isPersonName(t.slice(-3))) return true;
      if (isPersonName(t.slice(-2))) return true;
    }
  }
  return false;
}

function autoTag(merchantName) {
  // 1. 직원 이름 → 인건비
  if (matchStaffName(merchantName)) {
    return { cat: '인건비', biz: '', autoTagged: true };
  }
  // 2. 키워드 룰 (급여·일괄 포함)
  var upper = merchantName.toUpperCase();
  for (var i = 0; i < AUTO_RULES.length; i++) {
    var rule = AUTO_RULES[i];
    for (var j = 0; j < rule.kw.length; j++) {
      if (upper.includes(rule.kw[j].toUpperCase())) {
        return { cat: rule.cat, biz: rule.biz, autoTagged: true };
      }
    }
  }
  // 3. 직원 외 사람 이름 패턴 → 기타
  if (looksLikePersonName(merchantName)) {
    return { cat: '기타', biz: '', autoTagged: true };
  }
  return { cat: '', biz: '', autoTagged: false };
}

// ── 파일 업로드 처리 ──────────────────────────────────
var _zone = document.getElementById('uploadZone');
var _fileInput = document.getElementById('fileInput');

_zone.addEventListener('dragover', function(e){ e.preventDefault(); _zone.classList.add('drag'); });
_zone.addEventListener('dragleave', function(){ _zone.classList.remove('drag'); });
_zone.addEventListener('drop', function(e){
  e.preventDefault(); _zone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
_fileInput.addEventListener('change', function(){ handleFiles(this.files); });

function handleFiles(files) {
  Array.from(files).forEach(function(file) {
    var ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'csv') {
      showLoad('파일 읽는 중...');
      var reader = new FileReader();
      reader.onload = function(e) {
        var text = e.target.result;
        var firstLines = text.split(/\r?\n/).slice(0, 30);
        var headerLine = firstLines.find(function(l){ return l.toLowerCase().includes('거래일'); }) || firstLines[0];
        var headers = splitCSVLine(headerLine || '');
        var bank = detectBank(headers);
        var existing = _files.findIndex(function(f){ return f.name === file.name; });
        var entry = { name: file.name, bank: bank, text: text, type: 'csv', rows: 0 };
        if (existing >= 0) _files[existing] = entry;
        else _files.push(entry);
        renderFileList();
        hideLoad();
      };
      reader.onerror = function(){ hideLoad(); };
      reader.readAsText(file, 'euc-kr');
    } else if (ext === 'xlsx') {
      showLoad('파일 읽는 중...');
      (function(f2){
        var reader2 = new FileReader();
        reader2.onload = function(e) {
          var parsed = parseExcelData(e.target.result, 'array', f2.name);
          var bank = parsed.bank; var rows = parsed.rows;
          var existing = _files.findIndex(function(f){ return f.name === f2.name; });
          var entry = { name: f2.name, bank: bank, parsed: rows, type: 'excel', rows: 0 };
          if (existing >= 0) _files[existing] = entry; else _files.push(entry);
          renderFileList();
          hideLoad();
        };
        reader2.onerror = function(){ hideLoad(); };
        reader2.readAsArrayBuffer(f2);
      })(file);
    } else if (ext === 'xls') {
      // 1차: ArrayBuffer (이진 XLS)
      // 2차: EUC-KR 텍스트 → DOMParser (KB·광주 HTML-format XLS)
      // 3차: CSV 파서 폴백
      showLoad('파일 읽는 중...');
      (function(f2){
        function xlsDone(){ hideLoad(); }
        // 공통: 파일명 보정 헬퍼
        function fixBank(p) {
          if (p.rows.length > 0 && p.bank === '?') {
            var fb = bankFromFilename(f2.name);
            if (fb !== '?') { p.bank = fb; p.rows.forEach(function(r){ r.bank = fb; }); }
          }
          return p;
        }
        // 공통: HTML/CSV 폴백 (EUC-KR or UTF-8 이미 읽은 텍스트)
        function htmlCsvFallback(text, label, done2, sbDiag) {
          // 1) Excel XML 2003 (SpreadsheetML) 시도 — 농협 등 XML 형식 XLS
          if (/<[Ww]orkbook\b|<[Ww]orksheet\b|schemas-microsoft-com.*spreadsheet/.test(text.substring(0, 2000))) {
            var xmlResult = parseXmlXls(text, f2.name);
            if (xmlResult && xmlResult.rows.length > 0) {
              console.log('[XLS] '+label+' XML → bank:', xmlResult.bank, '행수:', xmlResult.rows.length);
              if (xmlResult.bank === '?') { var xfb = bankFromFilename(f2.name); if (xfb !== '?') xmlResult.bank = xfb; }
              registerEntry(f2, xmlResult, done2); return;
            }
          }
          // 2) HTML 테이블
          var p = parseHtmlXlsTable(text, f2.name);
          // SheetJS diag가 더 유용하면 그것을 우선
          var diag = (sbDiag && (sbDiag.headers||[]).length > 0) ? sbDiag : (p._diag || sbDiag);
          console.log('[XLS] '+label+' DOMParser → bank:', p.bank, '행수:', p.rows.length);
          if (p.rows.length === 0) {
            var db = detectBankFromText(text);
            if (db === '?') db = bankFromFilename(f2.name);
            var cr = parseCSVText(text, db);
            console.log('[XLS] '+label+' CSV 폴백 → bank:', db, '행수:', cr.length);
            p = { bank: cr.length ? db : '?', rows: cr, _diag: diag };
          }
          if (!p._diag) p._diag = diag;
          if (p.bank === '?') { var fb = bankFromFilename(f2.name); if (fb !== '?') p.bank = fb; }
          registerEntry(f2, p, done2);
        }
        var reader2 = new FileReader();
        reader2.onload = function(e) {
          console.log('[XLS] 파싱 시작:', f2.name);
          // 매직 바이트 확인 (형식 진단)
          var arr0 = new Uint8Array(e.target.result);
          var magic = Array.from(arr0.slice(0,16)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join(' ');
          console.log('[XLS] 매직 바이트:', magic, '| 파일:', f2.name);
          // 1차: Uint8Array → SheetJS (ArrayBuffer보다 안정적)
          var p1 = fixBank(parseExcelData(arr0, 'array', f2.name));
          console.log('[XLS] Uint8Array 결과 → bank:', p1.bank, '행수:', p1.rows.length);
          if (p1.rows.length > 0 && p1.bank !== '?') { registerEntry(f2, p1, xlsDone); return; }
          var sbDiag1 = p1._diag; // SheetJS 1차 진단 보존
          // 2차: BinaryString → SheetJS (BIFF8 바이너리 XLS 대응)
          var binReader = new FileReader();
          binReader.onload = function(be) {
            var p2 = fixBank(parseExcelData(be.target.result, 'binary', f2.name));
            console.log('[XLS] BinaryString 결과 → bank:', p2.bank, '행수:', p2.rows.length);
            if (p2.rows.length > 0 && p2.bank !== '?') { registerEntry(f2, p2, xlsDone); return; }
            // 두 SheetJS 결과 중 더 유용한 diag 선택
            var bestSbDiag = (p2._diag && (p2._diag.headers||[]).length > 0) ? p2._diag : (sbDiag1 || p2._diag);
            // 3차: HTML-format XLS (EUC-KR 텍스트 읽기)
            var textReader = new FileReader();
            textReader.onload = function(te) {
              var text = te.target.result;
              if (/(?:charset|encoding)\s*=\s*["']?utf-?8/i.test(text.substring(0, 2000))) {
                console.log('[XLS] UTF-8 파일 감지 → 재읽기');
                var utfReader = new FileReader();
                utfReader.onload = function(ue) { htmlCsvFallback(ue.target.result, 'UTF-8', xlsDone, bestSbDiag); };
                utfReader.onerror = xlsDone;
                utfReader.readAsText(f2, 'utf-8');
                return;
              }
              console.log('[XLS] EUC-KR 텍스트 앞 200자:', text.substring(0, 200));
              htmlCsvFallback(text, 'EUC-KR', xlsDone, bestSbDiag);
            };
            textReader.onerror = xlsDone;
            textReader.readAsText(f2, 'euc-kr');
          };
          binReader.onerror = xlsDone;
          binReader.readAsBinaryString(f2);
        };
        reader2.onerror = xlsDone;
        reader2.readAsArrayBuffer(f2);
      })(file);
    }
  });
}

function pad2(n){ return n < 10 ? '0'+n : String(n); }

// Excel XML 2003 (SpreadsheetML) 파서 — 농협 등 XML 형식 XLS 처리
function parseXmlXls(text, filename) {
  try {
    var parser = new DOMParser();
    var doc = parser.parseFromString(text, 'application/xml');
    if (doc.querySelector('parsererror')) return null;
    var NS = 'urn:schemas-microsoft-com:office:spreadsheet';
    function getEls(parent, tag) {
      var r = parent.getElementsByTagNameNS(NS, tag);
      if (!r || r.length === 0) r = parent.getElementsByTagName(tag);
      return r;
    }
    var allRowEls = getEls(doc, 'Row');
    if (!allRowEls || allRowEls.length === 0) return null;
    var allRows = [];
    for (var ri = 0; ri < allRowEls.length; ri++) {
      var cellEls = getEls(allRowEls[ri], 'Data');
      var row = [];
      for (var ci = 0; ci < cellEls.length; ci++) {
        row.push((cellEls[ci].textContent || '').replace(/\s+/g,' ').trim());
      }
      allRows.push(row);
    }
    var HDR = ['거래일','출금','입금','순번','날짜','적요','내용','잔액','금액','보낸분','받는분','기록사항'];
    var headerIdx = -1;
    for (var hi = 0; hi < Math.min(allRows.length, 80); hi++) {
      var joined = allRows[hi].join(',');
      var hits = HDR.filter(function(k){ return joined.includes(k); }).length;
      if (hits >= 1 && allRows[hi].filter(function(c){ return c; }).length >= 3) { headerIdx = hi; break; }
    }
    if (headerIdx < 0) { console.warn('[parseXmlXls] 헤더 미발견 rows='+allRows.length); return null; }
    var headers = allRows[headerIdx];
    var bank = detectBank(headers);
    if (bank === '?') bank = bankFromFilename(filename) || '?';
    var iDate=-1, iMerchant=-1, iOut=-1, iIn=-1;
    iMerchant = findMerchantCol(headers, bank);
    headers.forEach(function(h,i){
      var t = h.replace(/\s/g,'');
      if (iDate<0 && (t.includes('거래일')||t==='날짜'||t==='일시')) iDate=i;
      if (iOut<0 && (t.includes('출금')||t==='차변')) iOut=i;
      if (iIn<0 && (t.includes('입금')||t==='대변')) iIn=i;
    });
    console.log('[parseXmlXls] bank:'+bank+' iDate:'+iDate+' iMerchant:'+iMerchant+' rows:'+(allRows.length-headerIdx-1));
    var parsed = [];
    for (var j = headerIdx+1; j < allRows.length; j++) {
      var row = allRows[j];
      var merchant = iMerchant>=0 ? row[iMerchant] : '';
      if (!merchant || merchant==='-') continue;
      var date = normalizeDate(iDate>=0 ? row[iDate] : '');
      if (!date) continue;
      parsed.push({ date:date, merchant:merchant, out:parseAmount(iOut>=0?row[iOut]:''), in:parseAmount(iIn>=0?row[iIn]:''), bank:bank });
    }
    return { bank:bank, rows:parsed };
  } catch(e) { console.error('[parseXmlXls]', e.message); return null; }
}

// 텍스트에서 은행 감지 (CSV 폴백용)
function detectBankFromText(text) {
  var lines = text.split(/\r?\n/).slice(0, 30);
  for (var i = 0; i < lines.length; i++) {
    var bank = detectBank(splitCSVLine(lines[i]));
    if (bank !== '?') return bank;
  }
  return '?';
}

// EUC-KR 텍스트로 읽은 HTML-format XLS를 DOMParser로 파싱
function parseHtmlXlsTable(text, filename) {
  try {
    var parser = new DOMParser();
    var doc = parser.parseFromString(text, 'text/html');

    // 테이블 → 행 배열로 변환 (공통 헬퍼)
    function extractRows(table) {
      var result = [];
      for (var r = 0; r < table.rows.length; r++) {
        var cells = [];
        for (var c = 0; c < table.rows[r].cells.length; c++) {
          cells.push(table.rows[r].cells[c].textContent.replace(/\s+/g,' ').trim());
        }
        result.push(cells);
      }
      return result;
    }

    // 헤더 키워드 (광범위 — 1개만 있어도 후보로 인정)
    var HDR_KEYS = [
      '거래일','출금','입금','날짜','적요','내용','잔액','금액',
      '보낸분','받는분','기록사항','거래처','순번','구분','잔고','차변','대변'
    ];

    var allTables = doc.querySelectorAll('table');
    console.log('[parseHtmlXlsTable] 테이블 수:', allTables.length);

    // 모든 테이블을 스캔하여 헤더가 있는 최적 테이블 선택
    var bestTable = null, bestRows = null, bestHeaderIdx = -1, bestHits = 0;

    allTables.forEach(function(table) {
      var tRows = extractRows(table);
      for (var hi = 0; hi < Math.min(tRows.length, 80); hi++) {
        var joined = tRows[hi].join(',');
        var nonEmpty = tRows[hi].filter(function(c){ return c; }).length;
        var hits = HDR_KEYS.filter(function(k){ return joined.includes(k); }).length;
        // 조건: 키워드 1개 이상 + 비어있지 않은 셀 3개 이상
        if (hits >= 1 && nonEmpty >= 3) {
          if (hits > bestHits ||
              (hits === bestHits && bestTable && table.rows.length > bestTable.rows.length)) {
            bestTable = table;
            bestRows = tRows;
            bestHeaderIdx = hi;
            bestHits = hits;
          }
          break;
        }
      }
    });

    // 헤더 미발견 시 모든 테이블 전체 행 출력 (진단용)
    if (!bestTable || bestHeaderIdx < 0) {
      console.warn('[parseHtmlXlsTable] 헤더 탐색 실패 — 전체 행 내용:');
      allTables.forEach(function(table, ti) {
        var tRows = extractRows(table);
        tRows.forEach(function(row, ri) {
          console.log('  테이블'+ti+' 행'+ri+':', row.join(' | '));
        });
      });
      return { bank: '?', rows: [], _diag: { bank:'?', iDate:-1, iMerchant:-1, iOut:-1, iIn:-1, headers:[], sampleDate:'', sampleMerchant:'', noTable: allTables.length === 0, noHeader: allTables.length > 0 } };
    }

    console.log('[parseHtmlXlsTable] 선택 테이블 행수:', bestTable.rows.length,
      '| headerIdx:', bestHeaderIdx, '| 헤더:', bestRows[bestHeaderIdx].join('|'));

    var headers = bestRows[bestHeaderIdx];
    var bank = detectBank(headers);
    if (bank === '?') {
      var fb2 = bankFromFilename(filename);
      if (fb2 !== '?') { bank = fb2; console.log('[parseHtmlXlsTable] 파일명 bank 보정:', bank); }
    }
    var iDate=-1, iMerchant=-1, iOut=-1, iIn=-1;
    iMerchant = findMerchantCol(headers, bank);
    headers.forEach(function(h, i){
      var t = normH(h);
      if (iDate < 0 && (t.includes('거래일') || t==='날짜' || t==='일시')) iDate=i;
      if (iOut < 0 && (t.includes('출금') || t==='차변')) iOut=i;
      if (iIn < 0 && (t.includes('입금') || t==='대변')) iIn=i;
    });
    console.log('[parseHtmlXlsTable] bank:', bank, '| iDate:', iDate, '| iMerchant:', iMerchant, '| iOut:', iOut, '| iIn:', iIn);

    var parsed = [];
    var firstRow = bestRows[bestHeaderIdx+1] || [];
    for (var j = bestHeaderIdx+1; j < bestRows.length; j++) {
      var row = bestRows[j];
      if (!row || row.filter(function(c){ return c; }).length < 2) continue;
      var merchant = iMerchant >= 0 ? row[iMerchant] : '';
      if (!merchant || merchant === '-') continue;
      var dateRaw2 = iDate >= 0 ? row[iDate] : '';
      var date = normalizeDate(dateRaw2);
      if (!date) {
        if (parsed.length === 0 && j === bestHeaderIdx+1) console.warn('[parseHtmlXlsTable] 첫 행 날짜 파싱 실패 raw='+JSON.stringify(dateRaw2)+' merchant='+merchant);
        continue;
      }
      parsed.push({
        date: date, merchant: merchant,
        out: parseAmount(iOut >= 0 ? row[iOut] : ''),
        in:  parseAmount(iIn  >= 0 ? row[iIn]  : ''),
        bank: bank
      });
    }
    return { bank: bank, rows: parsed, _diag: { bank:bank, iDate:iDate, iMerchant:iMerchant, iOut:iOut, iIn:iIn, headers:bestRows[bestHeaderIdx], sampleDate: firstRow[iDate]||'', sampleMerchant: firstRow[iMerchant]||'' } };
  } catch(e) {
    console.error('[parseHtmlXlsTable] 예외:', e.message);
    return { bank: '?', rows: [] };
  }
}

// 파일 등록 공통 헬퍼
function registerEntry(f2, parsed, done) {
  var existing = _files.findIndex(function(f){ return f.name === f2.name; });
  var entry = { name: f2.name, bank: parsed.bank, parsed: parsed.rows, type: 'excel', rows: 0 };
  if (existing >= 0) _files[existing] = entry; else _files.push(entry);
  if (parsed._diag) _parseDiag[f2.name] = parsed._diag;
  renderFileList();
  if (done) done();
}

// SheetJS 공용 파서 — type: 'array'(xlsx)
function parseExcelData(data, type, filename) {
  try {
    var wb = XLSX.read(data, { type: type, cellDates: false, raw: true });
    console.log('[parseExcelData] type='+type+' SheetNames='+JSON.stringify(wb.SheetNames));
    var sheetName = wb.SheetNames.find(function(n){ return n.includes('거래'); }) || wb.SheetNames[0];
    var ws = wb.Sheets[sheetName];
    if (!ws) {
      console.error('[parseExcelData] ws 없음 sheetName='+sheetName);
      return { bank: '?', rows: [], _diag: { bank:'?', error:'시트 없음('+sheetName+')', iDate:-1, iMerchant:-1, iOut:-1, iIn:-1, headers:[], sampleDate:'', sampleMerchant:'' } };
    }
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true });
    console.log('[parseExcelData] 총 행수='+rows.length+' 첫행='+(rows[0]?rows[0].map(String).slice(0,6).join('|'):'(없음)'));

    var headerIdx = -1;
    var HDR_KEYS = ['거래일','출금','입금','순번','날짜','적요','내용','잔액','금액','보낸분','받는분','기록사항'];
    for (var hi = 0; hi < Math.min(rows.length, 80); hi++) {
      var joined = rows[hi].map(function(c){ return String(c); }).join(',');
      var nonEmpty = rows[hi].filter(function(c){ return String(c).trim(); }).length;
      var hitCount = HDR_KEYS.filter(function(k){ return joined.includes(k); }).length;
      if (hitCount >= 1 && nonEmpty >= 3) { headerIdx = hi; break; }
    }
    if (headerIdx < 0) {
      var sample3 = rows.slice(0,3).map(function(r){ return r.map(String).slice(0,6).join('|'); });
      console.warn('[parseExcelData] 헤더 탐색 실패 totalRows='+rows.length+' 앞3행:', JSON.stringify(sample3));
      return { bank: '?', rows: [], _diag: { bank:'?', error:'헤더 미발견(행수:'+rows.length+')', iDate:-1, iMerchant:-1, iOut:-1, iIn:-1, headers: rows[0]?rows[0].map(String).slice(0,8):[], sampleDate: String(rows[0]&&rows[0][0]||''), sampleMerchant: JSON.stringify(sample3) } };
    }

    var headers = rows[headerIdx].map(function(c){ return String(c).trim(); });
    var bank = detectBank(headers);
    // detectBank 실패 시 파일명으로 보정
    if (bank === '?') {
      var fb = bankFromFilename(filename);
      if (fb !== '?') { bank = fb; console.log('[parseExcelData] 파일명 bank 보정:', bank); }
    }
    if (bank === '?') console.warn('[parseExcelData] bank 미감지 — headers:', headers.join('|'));
    var iDate=-1, iMerchant=-1, iOut=-1, iIn=-1;
    iMerchant = findMerchantCol(headers, bank);
    headers.forEach(function(h, i){
      var t = h.replace(/\s/g,'');
      if (iDate < 0 && (t.includes('거래일') || t==='날짜' || t==='일시')) iDate=i;
      if (iOut < 0 && (t.includes('출금') || t==='차변')) iOut=i;
      if (iIn < 0 && (t.includes('입금') || t==='대변')) iIn=i;
    });
    console.log('[parseExcelData] bank:'+bank+' iDate:'+iDate+'('+headers[iDate]+') iMerchant:'+iMerchant+'('+headers[iMerchant]+') iOut:'+iOut+' iIn:'+iIn);

    var parsed = [];
    for (var j = headerIdx+1; j < rows.length; j++) {
      var row = rows[j];
      if (!row || row.length < 3) continue;
      var dateRaw = iDate >= 0 ? String(row[iDate]||'') : '';
      var merchant = iMerchant >= 0 ? String(row[iMerchant]||'').trim() : '';
      var outRaw = iOut >= 0 ? String(row[iOut]||'') : '';
      var inRaw  = iIn  >= 0 ? String(row[iIn]||'')  : '';
      if (!merchant || merchant==='-') continue;
      var date = normalizeDate(dateRaw);
      if (!date) {
        if (parsed.length === 0 && j === headerIdx+1) console.warn('[parseExcelData] 첫 행 날짜 파싱 실패 raw='+JSON.stringify(dateRaw)+' merchant='+merchant);
        continue;
      }
      parsed.push({ date:date, merchant:merchant, out:parseAmount(outRaw), in:parseAmount(inRaw), bank:bank });
    }
    return { bank: bank, rows: parsed, _diag: { bank:bank, iDate:iDate, iMerchant:iMerchant, iOut:iOut, iIn:iIn, headers:headers.slice(0,10), sampleDate: rows[headerIdx+1] ? String(rows[headerIdx+1][iDate]||'') : '', sampleMerchant: rows[headerIdx+1] ? String(rows[headerIdx+1][iMerchant]||'') : '' } };
  } catch(e) {
    console.error('[parseExcelData] SheetJS 예외 (type='+type+'):', e.message);
    return { bank: '?', rows: [], _diag: { bank:'?', error: e.message, iDate:-1, iMerchant:-1, iOut:-1, iIn:-1, headers:[], sampleDate:'', sampleMerchant:'' } };
  }
}

function parseAll() {
  document.getElementById('parseBtn').disabled = true;
  showLoad('파싱 중...');
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      _parseAllCore();
    });
  });
}

function _parseAllCore() {
  _txns = [];
  _files.forEach(function(f){
    var rows = f.parsed ? f.parsed : parseCSVText(f.text, f.bank);
    f.rows = rows.length;
    _txns = _txns.concat(rows);
  });

  // 거래처 집계
  _merchants = {};
  _txns.forEach(function(t){
    var k = t.merchant;
    if (!_merchants[k]) {
      var tag = autoTag(k);
      _merchants[k] = {
        name: k, count: 0, totalOut: 0, totalIn: 0,
        cat: tag.cat, biz: tag.biz, autoTagged: tag.autoTagged,
        sampleDate: t.date
      };
    }
    _merchants[k].count++;
    _merchants[k].totalOut += t.out;
    _merchants[k].totalIn += t.in;
    var ym = t.date.substring(0, 7);
    if (!_merchants[k].monthly) _merchants[k].monthly = {};
    if (!_merchants[k].monthly[ym]) _merchants[k].monthly[ym] = { out: 0, in: 0 };
    _merchants[k].monthly[ym].out += t.out;
    _merchants[k].monthly[ym].in += t.in;
  });

  // 미분류 중 총 출금 1만 이하 → 기타 자동태그
  Object.keys(_merchants).forEach(function(k) {
    var m = _merchants[k];
    // 건당 평균 출금 1만원 이하 → 기타
    if (!m.cat && m.count > 0 && m.totalOut > 0 && Math.round(m.totalOut / m.count) <= 10000) {
      m.cat = '기타'; m.autoTagged = true;
    }
    // 출금액 0 (입금 전용 또는 -/무 금액) → 기타
    if (!m.cat && m.count > 0 && m.totalOut <= 0) {
      m.cat = '기타'; m.autoTagged = true;
    }
  });

  renderFileList();
  showParseResult();
  updateProgress();
  renderMerchants();
  populateYears();
  switchTab('tag');
  hideLoad(); // 'parseAll' showLoad와 균형 맞춤
  loadSavedTags(); // 자체 showLoad/hideLoad 쌍을 가짐
}

function showParseResult() {
  var total = _txns.length;
  var mCount = Object.keys(_merchants).length;
  var autoCount = Object.values(_merchants).filter(function(m){ return m.autoTagged; }).length;
  var pendingCount = Object.values(_merchants).filter(function(m){ return !m.cat; }).length;

  var el = document.getElementById('parseResult');
  el.style.display = 'block';
  el.innerHTML =
    '<b>파싱 완료</b> — 총 <b>' + total.toLocaleString() + '건</b>, ' +
    '거래내용 <b>' + mCount.toLocaleString() + '개</b><br>' +
    '자동 분류: <b>' + autoCount + '개</b> · ' +
    '검수 필요: <b style="color:var(--accent)">' + pendingCount + '개</b>';
}

// ── 진행률 ────────────────────────────────────────────
function updateProgress() {
  var keys = Object.keys(_merchants);
  if (keys.length === 0) { document.getElementById('progressWrap').style.display = 'none'; return; }
  var done = keys.filter(function(k){ return _merchants[k].cat; }).length;
  var total = keys.length;
  var pct = Math.round(done / total * 100);

  document.getElementById('progressWrap').style.display = 'flex';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressDone').textContent = done;
  document.getElementById('progressTotal').textContent = total;
  document.getElementById('progressPct').textContent = pct + '%';

  var pending = total - done;
  var badge = document.getElementById('pendingBadge');
  badge.style.display = pending > 0 ? '' : 'none';
  badge.textContent = pending;
}

var _filter = 'all';
function setFilter(f) {
  _filter = f;
  ['All','Pending','Done'].forEach(function(x){
    document.getElementById('filter'+x).classList.toggle('active', f === x.toLowerCase());
  });
  renderMerchants();
}

function renderMerchants() {
  var keys = Object.keys(_merchants);
  if (keys.length === 0) return;

  var q = document.getElementById('tagSearch').value.toLowerCase();
  var catFilter = document.getElementById('filterCat') ? document.getElementById('filterCat').value : '';
  _vsFiltered = keys.filter(function(k){
    var m = _merchants[k];
    if (q && !m.name.toLowerCase().includes(q)) return false;
    if (_filter === 'pending' && m.cat) return false;
    if (_filter === 'done' && !m.cat) return false;
    if (catFilter && m.cat !== catFilter) return false;
    return true;
  });
  _vsFiltered.sort(function(a, b){
    var ma = _merchants[a], mb = _merchants[b];
    if (!ma.cat && mb.cat) return -1;
    if (ma.cat && !mb.cat) return 1;
    return mb.totalOut - ma.totalOut;
  });

  document.getElementById('tagCount').textContent = _vsFiltered.length + '개 거래내용';

  var wrap = document.getElementById('merchantTableWrap');
  if (!document.getElementById('vsScrollWrap')) {
    wrap.innerHTML =
      '<div id="vsScrollWrap" class="vs-scroll-wrap">' +
        '<table class="merchant-table">' +
          '<thead><tr>' +
            '<th style="width:24px"></th>' +
            '<th>거래내용</th>' +
            '<th style="width:80px;text-align:right">건수</th>' +
            '<th style="width:110px;text-align:right">총 출금액</th>' +
            '<th style="width:140px">카테고리</th>' +
            '<th style="width:120px">사업자</th>' +
            '<th style="width:150px">프로젝트</th>' +
          '</tr></thead>' +
          '<tbody id="vsTbody"></tbody>' +
        '</table>' +
      '</div>';
    document.getElementById('vsScrollWrap').addEventListener('scroll', function(){
      _vsScrollTop = this.scrollTop;
      vsRender(_vsScrollTop);
    });
  }

  vsRender(_vsScrollTop);
}

function vsRender(scrollTop) {
  var tbodyEl = document.getElementById('vsTbody');
  var wrapEl = document.getElementById('vsScrollWrap');
  if (!tbodyEl || !wrapEl) return;
  var viewH = wrapEl.clientHeight || 500;
  var total = _vsFiltered.length;

  var startIdx = Math.max(0, Math.floor(scrollTop / VS_ROW_H) - VS_BUFFER);
  var endIdx = Math.min(total, Math.ceil((scrollTop + viewH) / VS_ROW_H) + VS_BUFFER);
  var topH = startIdx * VS_ROW_H;
  var bottomH = Math.max(0, (total - endIdx) * VS_ROW_H);

  var html = '<tr class="vs-spacer"><td colspan="7" style="height:' + topH + 'px"></td></tr>';
  for (var i = startIdx; i < endIdx; i++) {
    var k = _vsFiltered[i];
    var m = _merchants[k];
    var isTagged = !!m.cat;
    var staffMatch = matchStaffName(m.name);
    var displayName = staffMatch
      ? m.name.replace(staffMatch, '<span class="staff-name">' + staffMatch + '</span>')
      : m.name;
    html +=
      '<tr class="' + (isTagged ? '' : 'untagged') + '">' +
      '<td><span class="tag-status ' + (isTagged ? 'done' : 'pending') + '"></span></td>' +
      '<td class="td-merchant" title="' + m.name + '">' + displayName + '</td>' +
      '<td class="td-count">' + m.count + '</td>' +
      '<td class="td-amount">' + (m.totalOut > 0 ? (m.totalOut/10000).toFixed(0) + '만' : '-') + '</td>' +
      '<td>' + catSelect(k, m.cat) + '</td>' +
      '<td>' + bizSelect(k, m.biz) + '</td>' +
      '<td>' + projSelect(k, m.biz, m.proj || '') + '</td>' +
      '</tr>';
  }
  html += '<tr class="vs-spacer"><td colspan="7" style="height:' + bottomH + 'px"></td></tr>';
  tbodyEl.innerHTML = html;
}

function catSelect(key, val) {
  var opts = '<option value="">-- 미분류 --</option>';
  CATS.forEach(function(c){ opts += '<option' + (c === val ? ' selected' : '') + '>' + c + '</option>'; });
  var cls = val ? 'tagged' : 'untagged';
  return '<select class="cat-select ' + cls + '" onchange="setTag(\'' + escKey(key) + '\',\'cat\',this.value)">' + opts + '</select>';
}

function bizSelect(key, val) {
  var opts = '<option value="">-- 미배분 --</option>';
  BIZS.forEach(function(b){ opts += '<option' + (b === val ? ' selected' : '') + '>' + b + '</option>'; });
  return '<select class="biz-select" onchange="setTag(\'' + escKey(key) + '\',\'biz\',this.value)">' + opts + '</select>';
}

function projSelect(key, biz, projVal) {
  var projs = PROJ_BY_BIZ[biz] || [];
  if (projs.length === 0) return '<span style="color:var(--muted);font-size:11px;padding:5px 8px;display:inline-block">-</span>';
  var opts = '<option value="">-- 미선택 --</option>';
  projs.forEach(function(p){ opts += '<option' + (p === projVal ? ' selected' : '') + '>' + p + '</option>'; });
  return '<select class="proj-select" onchange="setTag(\'' + escKey(key) + '\',\'proj\',this.value)">' + opts + '</select>';
}

function escKey(k) { return k.replace(/'/g, "\\'").replace(/\\/g, '\\\\'); }

function setTag(key, field, val) {
  if (!_merchants[key]) return;
  _merchants[key][field] = val;
  // 사업자 변경 시 해당 사업자의 프로젝트 목록에 없는 proj는 초기화
  if (field === 'biz') {
    var projs = PROJ_BY_BIZ[val] || [];
    if (projs.indexOf(_merchants[key].proj || '') < 0) _merchants[key].proj = '';
  }
  updateProgress();
  saveState();
  var sw = document.getElementById('vsScrollWrap');
  if (sw) _vsScrollTop = sw.scrollTop;
  renderMerchants();
}

var _aggMode = 'out';

function switchAggMode(mode) {
  _aggMode = mode;
  document.getElementById('aggModeOut').classList.toggle('active', mode === 'out');
  document.getElementById('aggModeIn').classList.toggle('active', mode === 'in');
  document.getElementById('aggCatWrap').style.display = mode === 'out' ? '' : 'none';
  document.getElementById('aggViewCatOpt').textContent = mode === 'out' ? '카테고리별' : '거래처별';
  renderAgg();

function populateYears() {
  var years = {};
  if (_txns.length > 0) {
    _txns.forEach(function(t){ years[t.date.substring(0,4)] = 1; });
  } else {
    Object.values(_merchants).forEach(function(m) {
      if (m.monthly) Object.keys(m.monthly).forEach(function(ym){ years[ym.substring(0,4)] = 1; });
    });
  }
  var sel = document.getElementById('aggYear');
  var prev = sel.value;
  sel.innerHTML = '<option value="">전체 연도</option>';
  Object.keys(years).sort().forEach(function(y){
    sel.innerHTML += '<option' + (y === prev ? ' selected' : '') + '>' + y + '</option>';
  });
}


// CSV 없을 때 merchant.monthly 데이터로 pseudo-txns 생성
function makePseudoTxns() {
  var txns = [];
  Object.keys(_merchants).forEach(function(k) {
    var m = _merchants[k];
    if (!m.monthly) return;
    Object.keys(m.monthly).forEach(function(ym) {
      var mo = m.monthly[ym];
      txns.push({ date: ym + '-01', merchant: k, out: mo.out || 0, in: mo.in || 0, bank: '' });
    });
  });
  return txns;
}

function renderAgg() {
  var usedTxns = _txns;
  if (usedTxns.length === 0) {
    usedTxns = makePseudoTxns();
    if (usedTxns.length === 0) {
      document.getElementById('aggTableWrap').innerHTML =
        '<div class="no-data">집계를 보려면 <b>업로드 탭에서 CSV를 업로드</b>해 주세요.</div>';
      return;
    }
  }
  // 이하 모든 필터링은 usedTxns 사용

  var year = document.getElementById('aggYear').value;
  var biz  = document.getElementById('aggBiz').value;
  var view = document.getElementById('aggView').value;

  if (_aggMode === 'in') {
    var filteredIn = usedTxns.filter(function(t){
      if (t.in === 0) return false;
      if (year && t.date.substring(0,4) !== year) return false;
      var m = _merchants[t.merchant] || {};
      if (biz && (m.biz || '미배분') !== biz) return false;
      return true;
    });
    if (filteredIn.length === 0) {
      document.getElementById('aggTableWrap').innerHTML = '<div class="no-data">해당 조건에 맞는 입금 거래가 없습니다.</div>';
      return;
    }
    if (view === 'month') renderAggMonthIn(filteredIn);
    else renderAggSourceIn(filteredIn);
    return;
  }

  var cat = document.getElementById('aggCat').value;
  var filtered = usedTxns.filter(function(t){
    if (t.out === 0) return false;
    var m = _merchants[t.merchant];
    if (!m || (!m.cat && !m.biz)) return false;
    if (year && t.date.substring(0,4) !== year) return false;
    if (biz && (m.biz || '미배분') !== biz) return false;
    if (cat && (m.cat || '미분류') !== cat) return false;
    return true;
  });

  if (filtered.length === 0) {
    document.getElementById('aggTableWrap').innerHTML = '<div class="no-data">해당 조건에 맞는 태그된 거래가 없습니다.<br>태깅 작업 탭에서 카테고리/사업자를 지정해 주세요.</div>';
    return;
  }

  if (view === 'month') renderAggMonth(filtered);
  else renderAggCat(filtered);
}

function renderAggMonth(txns) {
  // 월별 × 카테고리
  var data = {}; // {YYYY-MM: {cat: amount}}
  var allCats = {};
  txns.forEach(function(t){
    var m = _merchants[t.merchant];
    var ym = t.date.substring(0, 7);
    var catKey = m.cat || '미분류';
    if (!data[ym]) data[ym] = {};
    data[ym][catKey] = (data[ym][catKey] || 0) + t.out;
    allCats[catKey] = 1;
  });

  var months = Object.keys(data).sort();
  var cats = CATS.filter(function(c){ return allCats[c]; });
  if (allCats['미분류']) cats.push('미분류');

  var html = '<table class="agg-table"><thead><tr><th>월</th>';
  cats.forEach(function(c){ html += '<th>' + c + '</th>'; });
  html += '<th>합계</th></tr></thead><tbody>';

  var totals = {};
  var curYear = null;
  var yearTotals = {};
  var colCount = cats.length + 2; // 월 + cats + 합계

  function flushYearSub(yr) {
    var yrTotal = cats.reduce(function(s,c){ return s + (yearTotals[c]||0); }, 0);
    html += '<tr class="year-sub"><td>' + yr + '년 소계</td>';
    cats.forEach(function(c){ html += '<td>' + fmt(yearTotals[c]||0) + '</td>'; });
    html += '<td><b>' + fmt(yrTotal) + '</b></td></tr>';
    yearTotals = {};
  }

  months.forEach(function(ym){
    var yr = ym.substring(0, 4);
    if (yr !== curYear) {
      if (curYear !== null) flushYearSub(curYear);
      html += '<tr class="year-sep"><td colspan="' + colCount + '">' + yr + '년</td></tr>';
      curYear = yr;
    }
    var row = data[ym];
    var rowTotal = cats.reduce(function(s, c){ return s + (row[c] || 0); }, 0);
    html += '<tr><td>' + ym + '</td>';
    cats.forEach(function(c){
      var v = row[c] || 0;
      html += '<td class="' + (v ? '' : 'zero') + '">' + (v ? fmt(v) : '-') + '</td>';
      totals[c] = (totals[c] || 0) + v;
      yearTotals[c] = (yearTotals[c] || 0) + v;
    });
    html += '<td><b>' + fmt(rowTotal) + '</b></td></tr>';
  });
  if (curYear !== null) flushYearSub(curYear);

  var grandTotal = cats.reduce(function(s,c){ return s + (totals[c]||0); }, 0);
  html += '<tr class="total"><td>전체 합계</td>';
  cats.forEach(function(c){ html += '<td>' + fmt(totals[c]||0) + '</td>'; });
  html += '<td>' + fmt(grandTotal) + '</td></tr>';
  html += '</tbody></table>';
  document.getElementById('aggTableWrap').innerHTML = html;
}

function renderAggCat(txns) {
  var data = {};
  txns.forEach(function(t){
    var m = _merchants[t.merchant];
    var catKey = m.cat || '미분류';
    if (!data[catKey]) data[catKey] = 0;
    data[catKey] += t.out;
  });
  var total = Object.values(data).reduce(function(s,v){ return s+v; }, 0);
  var html = '<table class="agg-table"><thead><tr><th>카테고리</th><th>금액</th><th>비중</th></tr></thead><tbody>';
  var ordered = CATS.filter(function(c){ return data[c]; });
  if (data['미분류']) ordered.push('미분류');
  ordered.forEach(function(c){
    var pct = total ? (data[c]/total*100).toFixed(1) : 0;
    html += '<tr><td>' + c + '</td><td>' + fmt(data[c]) + '</td><td>' + pct + '%</td></tr>';
  });
  html += '<tr class="total"><td>합계</td><td>' + fmt(total) + '</td><td>100%</td></tr>';
  html += '</tbody></table>';
  document.getElementById('aggTableWrap').innerHTML = html;
}

function renderAggMonthIn(txns) {
  var data = {};
  txns.forEach(function(t){
    var ym = t.date.substring(0, 7);
    if (!data[ym]) data[ym] = { total: 0, count: 0 };
    data[ym].total += t.in;
    data[ym].count++;
  });
  var months = Object.keys(data).sort();
  var html = '<table class="agg-table"><thead><tr><th>월</th><th style="text-align:right">건수</th><th style="text-align:right">입금액</th></tr></thead><tbody>';
  var curYear = null, yearTotals = { total: 0, count: 0 }, grandTotal = 0, grandCount = 0;
  var colCount = 3;
  function flushYearSubIn(yr) {
    html += '<tr class="year-sub"><td>' + yr + '년 소계</td><td>' + yearTotals.count + '</td><td>' + fmt(yearTotals.total) + '</td></tr>';
    yearTotals = { total: 0, count: 0 };
  }
  months.forEach(function(ym){
    var yr = ym.substring(0, 4);
    if (yr !== curYear) {
      if (curYear !== null) flushYearSubIn(curYear);
      html += '<tr class="year-sep"><td colspan="' + colCount + '">' + yr + '년</td></tr>';
      curYear = yr;
    }
    html += '<tr><td>' + ym + '</td><td>' + data[ym].count + '</td><td>' + fmt(data[ym].total) + '</td></tr>';
    yearTotals.total += data[ym].total;
    yearTotals.count += data[ym].count;
    grandTotal += data[ym].total;
    grandCount += data[ym].count;
  });
  if (curYear !== null) flushYearSubIn(curYear);
  html += '<tr class="total"><td>전체 합계</td><td>' + grandCount + '</td><td>' + fmt(grandTotal) + '</td></tr>';
  html += '</tbody></table>';
  document.getElementById('aggTableWrap').innerHTML = html;
}

function renderAggSourceIn(txns) {
  var data = {};
  txns.forEach(function(t){
    if (!data[t.merchant]) data[t.merchant] = { total: 0, count: 0 };
    data[t.merchant].total += t.in;
    data[t.merchant].count++;
  });
  var grandTotal = txns.reduce(function(s, t){ return s + t.in; }, 0);
  var sources = Object.keys(data).sort(function(a, b){ return data[b].total - data[a].total; });
  var html = '<table class="agg-table"><thead><tr><th>거래처</th><th style="text-align:right">건수</th><th style="text-align:right">입금액</th><th style="text-align:right">비중</th></tr></thead><tbody>';
  sources.forEach(function(s){
    var pct = grandTotal ? (data[s].total / grandTotal * 100).toFixed(1) : 0;
    html += '<tr><td>' + s + '</td><td>' + data[s].count + '</td><td>' + fmt(data[s].total) + '</td><td>' + pct + '%</td></tr>';
  });
  html += '<tr class="total"><td>합계</td><td>' + txns.length + '</td><td>' + fmt(grandTotal) + '</td><td>100%</td></tr>';
  html += '</tbody></table>';
  document.getElementById('aggTableWrap').innerHTML = html;
}

function fmt(n) { return n.toLocaleString() + '원'; }

// ── CSV 내보내기 ──────────────────────────────────────
function exportCSV() {
  var usedTxns = _txns.length > 0 ? _txns : makePseudoTxns();
  if (usedTxns.length === 0) { alert('데이터가 없습니다'); return; }

  // 현재 집계 화면과 동일한 필터 적용
  var year = (document.getElementById('aggYear') || {}).value || '';
  var biz  = (document.getElementById('aggBiz')  || {}).value || '';
  var cat  = (document.getElementById('aggCat')  || {}).value || '';

  var filtered = usedTxns.filter(function(t) {
    if (year && t.date.substring(0,4) !== year) return false;
    var m = _merchants[t.merchant] || {};
    if (biz && (m.biz || '미배분') !== biz) return false;
    if (cat && (m.cat || '미분류') !== cat) return false;
    return true;
  });

  var rows = [['날짜','거래내용','출금','입금','은행','카테고리','사업자','프로젝트']];
  filtered.forEach(function(t){
    var m = _merchants[t.merchant] || {};
    rows.push([t.date, t.merchant, t.out, t.in, t.bank, m.cat||'', m.biz||'', m.proj||'']);
  });
  var csv = rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'hanq_finance_' + new Date().toISOString().substring(0,10) + '.csv';
  a.click();
}
