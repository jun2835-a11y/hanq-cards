<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재무관리(신) — hanQ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F0;--surface:#FFFFFF;--border:#E2DED7;--ink:#1A1814;--ink2:#5C5851;
  --muted:#9A958F;--accent:#C8380A;
}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:13px;min-height:100vh;display:flex;flex-direction:column}
.page-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 32px;text-align:center}
.wip-icon{margin-bottom:24px;line-height:0}
.crane-rope{
  animation:craneHoist 2s ease-in-out infinite;
  transform-box:fill-box;
  transform-origin:top center;
}
@keyframes craneHoist{
  0%,100%{transform:translateY(0)}
  40%,60% {transform:translateY(-12px)}
}
.wip-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:white;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:4px 12px;margin-bottom:20px}
.wip-title{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-bottom:12px}
.wip-sub{font-size:14px;color:var(--muted);line-height:1.7;max-width:480px;margin-bottom:40px}
.wip-divider{width:40px;height:2px;background:var(--border);margin:0 auto 40px}
.wip-scope{background:var(--surface);border:1px solid var(--border);padding:28px 36px;max-width:540px;width:100%;text-align:left}
.wip-scope-title{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;font-weight:700}
.wip-scope-item{display:flex;align-items:flex-start;gap:10px;font-size:12px;color:var(--ink2);line-height:1.6;padding:6px 0;border-bottom:1px solid var(--border)}
.wip-scope-item:last-child{border-bottom:none}
.wip-scope-dot{width:4px;height:4px;border-radius:50%;background:var(--muted);flex-shrink:0;margin-top:7px}

/* 카운트다운 */
.countdown{
  position:fixed;bottom:28px;right:28px;
  background:var(--ink);color:rgba(255,255,255,.9);
  padding:12px 18px;
  font-size:12px;letter-spacing:.03em;
  display:flex;align-items:center;gap:10px;
}
.countdown-num{
  font-size:22px;font-weight:700;color:white;
  min-width:20px;text-align:center;line-height:1;
}
.countdown-bar-wrap{
  position:fixed;bottom:0;left:0;right:0;height:2px;background:rgba(0,0,0,.08);
}
.countdown-bar{
  height:100%;background:var(--accent);
  width:100%;
  transition:width 3.5s linear;
}
</style>
</head>
<body>

<div class="page-main">
  <div class="wip-icon">
    <svg id="crane-svg" viewBox="0 0 80 96" width="72" height="86" fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
      <!-- 마스트 -->
      <line x1="54" y1="6" x2="54" y2="86" stroke-width="3"/>
      <!-- 베이스 -->
      <line x1="40" y1="86" x2="68" y2="86" stroke-width="2.5"/>
      <!-- 지브 (수평) -->
      <line x1="6" y1="26" x2="72" y2="26" stroke-width="3"/>
      <!-- 지지 케이블 △ -->
      <line x1="54" y1="6" x2="6" y2="26" stroke-width="1.8"/>
      <line x1="54" y1="6" x2="72" y2="26" stroke-width="1.8"/>
      <!-- 카운터웨이트 -->
      <rect x="66" y="26" width="8" height="6" rx="1" fill="var(--ink)" stroke="none" opacity=".35"/>
      <!-- 트롤리 -->
      <rect x="18" y="21" width="11" height="7" rx="1" stroke-width="2"/>
      <!-- 로프 (정적, 트롤리 → 화물 위) -->
      <line id="crane-rope-line" x1="23.5" y1="28" x2="23.5" y2="54" stroke-width="1.8"/>
      <!-- 화물 + 훅 (JS 애니메이션) -->
      <g id="crane-load">
        <path d="M20.5 54 L20.5 59 Q20.5 64 23.5 64 Q26.5 64 26.5 59" stroke-width="2" fill="none"/>
        <rect x="17" y="52" width="13" height="9" rx="1.5" stroke-width="2"/>
      </g>
    </svg>
  </div>
  <div class="wip-badge">개발중</div>
  <div class="wip-title">재무관리(신)</div>
  <div class="wip-sub">5개년 계좌 거래내역 분류 및 사업자별 현금흐름 대시보드.<br>현재 설계 및 개발 중입니다.</div>
  <div class="wip-divider"></div>
  <div class="wip-scope">
    <div class="wip-scope-title">구현 예정 기능</div>
    <div class="wip-scope-item"><div class="wip-scope-dot"></div>CSV 다중 업로드 (KB · 농협 · 광주 · 신한)</div>
    <div class="wip-scope-item"><div class="wip-scope-dot"></div>거래내용별 자동 태깅 · 미분류 검수 인터페이스</div>
    <div class="wip-scope-item"><div class="wip-scope-dot"></div>사업자별 비용 배분 (한솔 · 수복지 · 한큐 · 교육원)</div>
    <div class="wip-scope-item"><div class="wip-scope-dot"></div>월별 매출 / 비용 / 이익 시각화 대시보드</div>
    <div class="wip-scope-item"><div class="wip-scope-dot"></div>인건비 상세 (비밀번호 보호) · 전체 / 직원용 토글</div>
  </div>
</div>

<div class="countdown" id="cdBox">
  <div class="countdown-num" id="cdNum">3</div>
  <div>초 후 본 페이지로 진입합니다</div>
</div>
<div class="countdown-bar-wrap">
  <div class="countdown-bar" id="cdBar"></div>
</div>

<script>
(function(){
  var load = document.getElementById('crane-load');
  var rope = document.getElementById('crane-rope-line');
  var maxLift = 14, period = 2200, start = null;
  function tick(ts){
    if(!start) start = ts;
    var t = ((ts - start) % period) / period;
    var lift = maxLift * 0.5 * (1 - Math.cos(2 * Math.PI * t));
    load.setAttribute('transform','translate(0,'+ (-lift).toFixed(2) +')');
    rope.setAttribute('y2', (54 - lift).toFixed(2));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
<script>
(function(){
  var n = 4;
  var bar = document.getElementById('cdBar');
  var num = document.getElementById('cdNum');

  // 1초 후 바 줄어들기 시작
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      bar.style.width = '0%';
    });
  });

  var iv = setInterval(function(){
    n--;
    if(n <= 0){
      clearInterval(iv);
      window.location.href = '/finance-work';
    } else {
      num.textContent = n;
    }
  }, 875);
})();
</script>
<script>(function(){if(window.self===window.top)return;var s=document.createElement("style");s.textContent="html,html *{cursor:none!important}";document.head.appendChild(s);document.addEventListener("mousemove",function(e){window.parent.postMessage({type:"cursor-move",x:e.clientX,y:e.clientY},"*");});})();</script>
</body>
</html>
